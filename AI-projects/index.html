<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root{
      --bg:#0B0D10; --panel:#12161C; --ink:#EEF1F4; --muted:#8B94A2; --faint:#565F6B;
      --line:#232A33; --accent:#3CE8A8; --accent-ink:#05130D; --warm:#FF9548; --maxw:760px;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      background: radial-gradient(1000px 460px at 85% -8%, rgba(60,232,168,.09), transparent 60%), var(--bg);
      color:var(--ink); font-family:'Manrope', sans-serif; font-size:17px; line-height:1.7;
      min-height:100vh; display:flex; flex-direction:column;
    }
    .wrap{ max-width:var(--maxw); margin:0 auto; padding:26px; width:100%; flex:1; display:flex; flex-direction:column; }
    .topbar{ display:flex; justify-content:space-between; align-items:center; padding:12px 0 60px; }
    .brand{ display:flex; align-items:center; gap:9px; font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--muted); text-decoration:none; }
    .brand-avatar{ width:100px; height:100px; border-radius:50%; object-fit:cover; border:1.5px solid var(--line); flex-shrink:0; }
    .brand strong{ color:var(--ink); }
    .back{ font-family:'JetBrains Mono', monospace; font-size:13.5px; color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; }
    .back:hover{ color:var(--accent); border-color:var(--accent); }
    main{ flex:1; display:flex; flex-direction:column; justify-content:center; }
    .k{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
    h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(30px,4.7vw,46px); margin-top:14px; letter-spacing:-.015em; }
    p{ margin-top:16px; font-size:16.5px; max-width:52ch; color:#C4CAD2; }
    .badge{ margin-top:36px; display:inline-flex; align-items:center; gap:10px; font-family:'JetBrains Mono', monospace; font-size:13.5px; color:var(--faint); border:1px solid var(--line); padding:10px 16px; border-radius:4px; width:fit-content; }
    .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
    footer{ padding:40px 0 10px; font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--faint); }
    footer a{ color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); }
    footer a:hover{ color:var(--accent); border-color:var(--accent); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">

    <div class="badge"><span class="dot"></span> Page under construction</div>

  </footer>
</div>
